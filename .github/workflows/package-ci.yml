name: Package CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test

  pack:
    name: Pack tarball
    runs-on: ubuntu-latest
    outputs:
      # The name this PR packs the tarball under, and — only when this PR
      # itself changes package.json's "name" relative to its base branch —
      # the name it is renamed FROM. `downstream` uses both: see the "Also
      # alias-install" step for why a rename needs special handling here.
      name: ${{ steps.rename.outputs.name }}
      legacy_name: ${{ steps.rename.outputs.legacy_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: "*.tgz"
          retention-days: 1
      # A package's npm name can change in a PR (a scope rename, e.g.
      # @metanull/foo -> @museumwnf/foo). When it does, every website still
      # imports the OLD name, and `npm install --no-save <tarball>` in
      # `downstream` below installs a tarball under whatever name its own
      # package.json declares — the NEW one. That lands in
      # node_modules/@new-scope/foo, which nothing imports; the site's
      # existing `@old-scope/foo` import keeps resolving to whatever version
      # npm ci pulled from the registry. The downstream build then reports
      # green having never touched this PR's code — a passing check that
      # validated nothing, worse than a failing one because nothing says so.
      # Detecting the rename here (by diffing package.json's "name" against
      # the PR's base branch) lets `downstream` alias-install the same
      # tarball under the old name too, so existing site imports actually
      # exercise this PR's code during the transition.
      - name: Detect a package rename against the PR base branch
        id: rename
        run: |
          set -euo pipefail
          new_name="$(node -p "require('./package.json').name")"
          echo "name=$new_name" >> "$GITHUB_OUTPUT"
          legacy_name=""
          if [ -n "${{ github.base_ref }}" ] && git fetch --depth=1 origin "${{ github.base_ref }}"; then
            if git show FETCH_HEAD:package.json > /tmp/base-package.json 2>/dev/null; then
              old_name="$(node -p "require('/tmp/base-package.json').name" 2>/dev/null || true)"
              if [ -n "$old_name" ] && [ "$old_name" != "$new_name" ]; then
                legacy_name="$old_name"
              fi
            fi
          fi
          echo "legacy_name=$legacy_name" >> "$GITHUB_OUTPUT"
          if [ -n "$legacy_name" ]; then
            echo "::notice::Package renamed $legacy_name -> $new_name in this PR. The downstream matrix will alias-install this PR's tarball as $legacy_name too, so sites still importing the old name build against this PR's real code instead of silently reusing the last published version."
          fi

  dependents:
    name: Discover websites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      count: ${{ steps.read.outputs.count }}
    steps:
      # A website is, by definition, a repository created from one of the
      # estate owner's site templates — website-template for a product,
      # gallery-template and exhibition-template for the DXA families (the
      # same list as tools/gh-lib.mjs's SITE_TEMPLATES) — the owner resolved
      # below via github.repository_owner, never hardcoded, since it has
      # already moved once. GitHub records the link permanently as
      # `template_repository`. Deriving the list from it means a new site is a
      # downstream consumer the moment it exists, with no file to maintain.
      #
      # This replaces the hand-written dependents.json, which had to be edited
      # in BOTH package repos for every new site and was the source of a
      # standing maintenance trap.
      #
      # The list endpoint omits `template_repository`, so each repo needs its
      # own call. That is one request per repo the owner has, which is cheap
      # and well inside the rate limit.
      #
      # Blind spot, accepted knowingly: this finds repositories OWNED by the
      # template's owner that still carry the link. A site created by fork, or
      # transferred in from elsewhere, would not appear — so the resolved list
      # and its count are printed on every run, and an unexpected drop is
      # visible in the log.
      #
      # A site whose scaffold pull request has not merged yet has no
      # package-lock.json on its default branch: its downstream job could only
      # fail, at setup-node, and hold every package release back until the
      # site merged — which may itself wait on that release
      # (museumwithnofrontiers/viewer-workflows#30). Such a site is left out
      # of the matrix and listed under "Skipped, not yet scaffolded", so the
      # drop is visible; tools/propagate.mjs skips it the same way.
      - name: Discover repositories created from a site template
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TEMPLATES: website-template gallery-template exhibition-template
        run: |
          set -euo pipefail
          repos="$(gh api "users/$OWNER/repos?per_page=100&type=owner" \
            --paginate --jq '.[] | select(.archived == false) | .name')"
          found=""
          skipped=""
          for repo in $repos; do
            template="$(gh api "repos/$OWNER/$repo" \
              --jq '.template_repository.full_name // ""')"
            site=""
            for name in $TEMPLATES; do
              if [ "$template" = "$OWNER/$name" ]; then site="$OWNER/$repo"; fi
            done
            [ -n "$site" ] || continue
            if gh api "repos/$site/contents/package-lock.json" --silent 2>/dev/null; then
              found="$found $site"
            else
              skipped="$skipped $site"
            fi
          done
          matrix="$(printf '%s\n' $found | jq -R -s -c 'split("\n") | map(select(length > 0)) | sort')"
          count="$(echo "$matrix" | jq 'length')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## Websites discovered: $count"
            echo ""
            echo "$matrix" | jq -r '.[] | "- \(.)"'
            if [ -n "$skipped" ]; then
              echo ""
              echo "## Skipped, not yet scaffolded"
              echo ""
              echo "No package-lock.json on the default branch: the scaffold pull request has not merged."
              echo ""
              for site in $skipped; do echo "- $site"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Discovered $count website(s) from $TEMPLATES:"
          echo "$matrix" | jq -r '.[] | "  \(.)"'
          for site in $skipped; do echo "  skipped, not yet scaffolded: $site"; done
          if [ "$count" -eq 0 ]; then
            echo "::notice::No websites found - no downstream builds to run."
          fi

  downstream:
    name: "Downstream: ${{ matrix.repo }}"
    needs: [pack, dependents]
    if: needs.dependents.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.dependents.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: ${{ runner.temp }}/tarball
      - name: Install dependencies with this PR's package build
        run: |
          npm ci
          npm install --no-save "$RUNNER_TEMP"/tarball/*.tgz
      # See the "Detect a package rename" step in `pack`: when this PR
      # renames the package, this site's own source still imports it under
      # the pre-rename name, which the install above does not touch (it only
      # ever populates node_modules/<new-scope>/<name>). Installing the same
      # tarball again, aliased to the old name, makes the site's existing
      # import resolve to this PR's real code instead of the version `npm ci`
      # pulled from the registry moments ago.
      - name: Also alias-install the tarball under its pre-rename name
        if: needs.pack.outputs.legacy_name != ''
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/tarball/*.tgz | head -n1)"
          npm install --no-save "${{ needs.pack.outputs.legacy_name }}@file:$tarball"
      - name: Build dependent
        run: npm run build
      - name: Test dependent
        run: npm run test

  # Single stable status for the whole downstream matrix.
  #
  # Branch protection requires job NAMES, and the matrix names its jobs after
  # the websites it discovered — a set that changes whenever a site is created.
  # Requiring those directly would mean editing the protection settings of both
  # package repos every time: forget to add a context and the canary is
  # silently no longer required; forget to remove one and every pull request is
  # blocked by a check that will never report again.
  #
  # Require `ci / Downstream (all)` instead. It never changes, however many
  # websites exist, so creating one needs no settings change anywhere.
  #
  # `if: always()` because this has to report even when the matrix fails.
  downstream-success:
    name: Downstream (all)
    needs: [dependents, downstream]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Zero websites is a FAILURE, not a quiet pass.
      #
      # An empty matrix skips `downstream` entirely, and a skipped job reports
      # `skipped` — so treating that as success makes this check report green
      # while validating nothing. That is not hypothetical: deleting
      # dependents.json while the calling repository still pinned a version
      # that read it produced exactly this, and the whole downstream canary
      # went silently dark behind a green tick.
      #
      # There is no legitimate zero. The platform always has websites; a count
      # of none means discovery is broken.
      - name: Check that websites were discovered
        run: |
          count='${{ needs.dependents.outputs.count }}'
          echo "websites discovered: $count"
          if [ "$count" = "0" ] || [ -z "$count" ]; then
            echo "::error::No websites were discovered, so nothing was built downstream. \
          This check exists to prevent a package change merging unvalidated - \
          investigate the Discover websites job rather than bypassing this."
            exit 1
          fi
      - name: Check the downstream matrix
        run: |
          result='${{ needs.downstream.result }}'
          echo "downstream matrix result: $result"
          case "$result" in
            success) exit 0 ;;
            *) echo "::error::At least one downstream build failed - see the Downstream jobs."; exit 1 ;;
          esac
