name: Website CI

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          Comma-separated languages the website offers, when it offers fewer
          than its data package declares (a site whose pages are English
          only, say). Passed to the texts check as `--languages`; empty, the
          check reads the package's `manifest.site.languages`.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    name: Test (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test

  # locale-validate.yml checks the texts a website writes; this checks the ones
  # it reads. It needs the installed dependencies, because the entries a call
  # site may use are the shared bundle plus the website's own file, and only an
  # install knows which bundle this website receives.
  texts:
    name: Texts (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check that every text a page asks for exists
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          if [ -n "$LANGUAGES" ]; then
            npx viewer-i18n-check --app . --languages "$LANGUAGES"
          else
            npx viewer-i18n-check --app .
          fi

  lint:
    name: Lint (reported, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      # setup-node registers the eslint-stylish problem matcher, so findings
      # surface as PR annotations; continue-on-error keeps the workflow green.
      - name: ESLint
        continue-on-error: true
        run: npm run lint

  audit:
    name: Audit (reported, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: npm audit
        continue-on-error: true
        run: |
          set +e
          audit_output="$(npm audit 2>&1)"
          status=$?
          {
            echo "## npm audit"
            echo ""
            echo '```'
            echo "$audit_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit reported vulnerabilities - see the Audit job summary for details."
          fi
          exit "$status"
