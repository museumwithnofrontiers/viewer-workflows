name: Scheduled npm audit

on:
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for a lockfile
        id: lockfile
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No lockfile yet: this repository has not had its first pull request. Skipping the audit."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.lockfile.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        if: steps.lockfile.outputs.present == 'true'
        run: npm ci
      - name: Run npm audit
        id: audit
        if: steps.lockfile.outputs.present == 'true'
        run: |
          set +e
          npm audit > audit.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          {
            echo "## npm audit"
            echo ""
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
      - name: Open or update the findings issue
        if: steps.lockfile.outputs.present == 'true' && steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="npm audit findings"
          {
            echo "The scheduled \`npm audit\` run of $(date -u +%Y-%m-%d) reported vulnerabilities:"
            echo ""
            echo '```'
            cat audit.txt
            echo '```'
            echo ""
            echo "_This issue is maintained automatically by the scheduled audit workflow. It is updated in place on every run that still has findings._"
          } > issue-body.md
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq 'map(select(.title == "npm audit findings")) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue edit "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi
