name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      base_path:
        description: Base path the site is built for (defaults to /<repo-name>/)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)" || {
            echo "::error::GitHub Pages is not enabled on ${GITHUB_REPOSITORY}. Run viewer-workflows/tools/new-website.mjs --settings-only --slug <name>, or Settings → Pages → Build and deployment → Source: GitHub Actions."
            exit 1
          }
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages on ${GITHUB_REPOSITORY} is set to source '$build_type', not GitHub Actions. Set Settings → Pages → Build and deployment → Source: GitHub Actions."
            exit 1
          fi
          echo "GitHub Pages build type: $build_type"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ inputs.base_path || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
